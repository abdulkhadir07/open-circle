spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=test-secret-must-be-at-least-32-characters-long
app.security.jwt.expiration-minutes=60

app.cors.allowed-origins=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@opencircle.test
app.verification.email.code-expiration-minutes=15
app.verification.email.max-attempts=5

app.password-reset.code-expiration-minutes=15
app.password-reset.max-attempts=5

app.chat.auto-close-job-enabled=false
app.rating.lifecycle-job-enabled=false

spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

app.storage.s3.bucket=opencircle-test-attachments
app.storage.s3.region=us-east-1
app.storage.s3.presigned-url-expiration-minutes=10

app.storage.attachments.max-file-size-bytes=10485760
app.storage.attachments.allowed-content-types=image/jpeg,image/png,image/webp,application/pdf
