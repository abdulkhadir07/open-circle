spring.application.name=open-circle-api

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.expiration-minutes=15

app.session.inactivity-timeout-days=7
app.session.absolute-lifetime-days=30
app.session.cleanup-retention-days=30
app.session.cookie-name=open_circle_refresh
app.session.cookie-path=/api/auth
app.session.cookie-same-site=Lax
app.session.cookie-secure=${APP_SESSION_COOKIE_SECURE:true}
app.session.cleanup-job-enabled=true
app.session.cleanup-cron=0 15 3 * * *

app.notification.retention-days=90
app.notification.cleanup-job-enabled=true
app.notification.cleanup-cron=0 15 3 * * *

app.invite-post.expiration-notification-job-enabled=true
app.invite-post.expiration-notification-job-delay-ms=60000

app.cors.allowed-origins=http://localhost:5173

app.mail.from=no-reply@opencircle.local
app.verification.email.code-expiration-minutes=15
app.verification.email.max-attempts=5

app.password-reset.code-expiration-minutes=15
app.password-reset.max-attempts=5

app.hidden-chats-pin.max-attempts=5
app.hidden-chats-pin.lockout-duration=15m

app.location.nominatim-base-url=https://nominatim.openstreetmap.org
app.location.user-agent=OpenCirclePortfolio/1.0 (https://github.com/abdulkhadir07/open-circle)

spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.storage.s3.bucket=${AWS_S3_BUCKET}
app.storage.s3.region=${AWS_REGION}
app.storage.s3.presigned-url-expiration-minutes=10

app.storage.attachments.max-file-size-bytes=10485760
app.storage.attachments.allowed-content-types=image/jpeg,image/png,image/webp,application/pdf

app.invite-post.images.max-images-per-post=4
app.storage.invite-post-images.max-file-size-bytes=5242880
app.storage.invite-post-images.allowed-content-types=image/jpeg,image/png,image/webp
app.storage.invite-post-images.view-url-expiration-minutes=60

app.storage.profile-images.max-file-size-bytes=5242880
app.storage.profile-images.allowed-content-types=image/jpeg,image/png,image/webp
app.storage.profile-images.view-url-expiration-minutes=60
